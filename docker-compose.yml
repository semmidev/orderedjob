services:
  postgres:
    image: postgres:16-alpine
    container_name: orderedjob-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderedjob
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderedjob"]
      interval: 3s
      timeout: 3s
      retries: 5
