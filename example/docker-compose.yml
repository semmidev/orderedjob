services:
  postgres:
    image: postgres:17-alpine
    container_name: orderedjob-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderedjob
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderedjob"]
      interval: 3s
      timeout: 3s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: orderedjob-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
